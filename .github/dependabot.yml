version: 2

# Cooldowns allow withdrawal before upgrades; security updates bypass them.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    ignore:
      # openapi-typescript 7.13.0 fails on TypeScript 7. Keep major upgrades blocked
      # until the generator supports them; minor/patch upgrades remain enabled.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: "/apps/api"
    schedule:
      interval: weekly
    groups:
      uv-dependencies:
        patterns: ["*"]
    cooldown:
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7

  # Group action updates; SHA pins use the flat cooldown because they lack SemVer.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
