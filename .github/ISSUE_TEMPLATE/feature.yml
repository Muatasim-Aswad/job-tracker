name: Feature request
description: Propose a focused improvement to job tracking.
body:
  - type: markdown
    attributes:
      value: Use synthetic examples and remove personal job, employer, applicant, and email data. Discuss questions and broader ideas at https://github.com/Muatasim-Aswad/job-tracker/discussions.
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed behavior
      description: Describe the job-tracking workflow, what is missing, and how the improvement would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Describe any alternatives you have considered or currently use.
