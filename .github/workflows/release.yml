name: Release

on:
  push:
    # The glob uses + for repeated digits; exact validation below enforces the release tag.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Only publication may write repository contents.
permissions:
  contents: read

jobs:
  verify:
    name: Verify canonical release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact canonical tag and product version
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" == "$SHA" ]]
          [[ "$(git describe --exact-match --tags "$SHA")" == "$TAG" ]]
          VERSION="$(tr -d '[:space:]' <VERSION)"
          [[ "$TAG" == "v$VERSION" ]]
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5
      - name: Install the pinned workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the repository gate
        run: bash scripts/check.sh
      - name: Build and verify release artifacts
        run: |
          set -euo pipefail
          python3 scripts/build-metadata.py --require-release --format shell > "$RUNNER_TEMP/identity.env"
          source "$RUNNER_TEMP/identity.env"
          bash scripts/build-release.sh
          bash scripts/check-release-contents.sh dist/release
      - name: Upload verified local artifacts for the publication job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5
      - name: Download the verified artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Verify downloaded artifact names, contents, and checksums
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' <VERSION)"
          [[ "$TAG" == "v$VERSION" ]]
          python3 scripts/build-metadata.py --require-release --format shell > "$RUNNER_TEMP/download-identity.env"
          source "$RUNNER_TEMP/download-identity.env"
          bash scripts/check-release-contents.sh "$RELEASE_DIR"
      - name: Smoke-test the downloaded runtime bundle and wheel
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' <VERSION)"
          python3 scripts/build-metadata.py --require-release --format shell > "$RUNNER_TEMP/smoke-identity.env"
          source "$RUNNER_TEMP/smoke-identity.env"
          bash scripts/check-release-contents.sh "$RELEASE_DIR"
          bash scripts/smoke-release.sh "$RELEASE_DIR/job-tracker-$VERSION-linux-x86_64.tar.gz"
          bash scripts/smoke-wheel.sh "$RELEASE_DIR/job_tracker-$VERSION-py3-none-any.whl"
      - name: Create one GitHub Release and upload its four verified files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' <VERSION)"
          [[ "$TAG" == "v$VERSION" ]]
          gh release create "$TAG" \
            "$RELEASE_DIR/job-tracker-$VERSION-linux-x86_64.tar.gz" \
            "$RELEASE_DIR/job-tracker-extension-$VERSION.zip" \
            "$RELEASE_DIR/job_tracker-$VERSION-py3-none-any.whl" \
            "$RELEASE_DIR/SHA256SUMS" \
            --verify-tag \
            --title "Job Tracker $VERSION" \
            --generate-notes
