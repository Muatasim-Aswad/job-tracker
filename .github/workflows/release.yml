name: Release

on:
  push:
    # GitHub's tag filters use its documented glob syntax: `+` requires one or
    # more preceding characters, and `.` is literal. A second exact-tag check
    # below keeps the release boundary explicit at the checked-out commit.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Verification needs only repository contents. The publication job is the sole
# exception because GitHub Releases are repository contents.
permissions:
  contents: read

jobs:
  verify:
    name: Verify canonical release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact canonical tag and product version
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" == "$SHA" ]]
          [[ "$(git describe --exact-match --tags "$SHA")" == "$TAG" ]]
          VERSION="$(tr -d '[:space:]' <VERSION)"
          [[ "$TAG" == "v$VERSION" ]]
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install the pinned workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the repository gate
        run: bash scripts/check.sh
      - name: Build and verify release artifacts
        run: |
          set -euo pipefail
          bash scripts/build-release.sh
          bash scripts/check-release-contents.sh dist/release
      - name: Upload verified local artifacts for the publication job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.28"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
      - name: Download the verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Verify downloaded artifact names, contents, and checksums
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' <VERSION)"
          [[ "$TAG" == "v$VERSION" ]]
          bash scripts/check-release-contents.sh "$RELEASE_DIR"
      - name: Smoke-test the downloaded runtime bundle and wheel
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' <VERSION)"
          bash scripts/smoke-release.sh "$RELEASE_DIR/job-tracker-$VERSION-linux-x86_64.tar.gz"
          bash scripts/smoke-wheel.sh "$RELEASE_DIR/job_tracker-$VERSION-py3-none-any.whl"
      - name: Create one GitHub Release and upload its four verified files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' <VERSION)"
          [[ "$TAG" == "v$VERSION" ]]
          gh release create "$TAG" \
            "$RELEASE_DIR/job-tracker-$VERSION-linux-x86_64.tar.gz" \
            "$RELEASE_DIR/job-tracker-extension-$VERSION.zip" \
            "$RELEASE_DIR/job_tracker-$VERSION-py3-none-any.whl" \
            "$RELEASE_DIR/SHA256SUMS" \
            --verify-tag \
            --title "Job Tracker $VERSION" \
            --generate-notes
