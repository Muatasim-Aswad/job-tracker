name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jobs needing more access must override the read-only default.
permissions:
  contents: read

jobs:
  api:
    name: API (ruff, mypy, pytest, dependency audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
      - run: uv sync
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest -q -m "not turso and not wheel"
      # Audit the resolved Python environment, not only direct dependencies.
      - run: uv export --no-hashes -o "$RUNNER_TEMP/requirements-audit.txt"
      - run: uvx pip-audit -r "$RUNNER_TEMP/requirements-audit.txt"

  ts:
    name: ts (vp check, typecheck, test, build, dependency audit, manifest hosts, markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      # Audit privileged development tooling too; transitive findings remain advisory.
      - run: pnpm audit --audit-level=moderate
        continue-on-error: true
      - run: pnpm exec vp check
      - run: pnpm exec vp run -r typecheck
      - run: pnpm exec vp run -r test
      - run: pnpm exec vp run -r build
      # Fresh CI checkouts have no ignored overlays, so this checks the public build.
      - run: node apps/extension/scripts/assert-manifest-hosts.mjs
      - run: pnpm run check:md

  contracts:
    name: contracts (generated API types drift, product version consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync
        working-directory: apps/api
      # Wheel tests require both Python and dashboard toolchains.
      - run: uv run --directory apps/api pytest -q -m wheel
      # Require generated API types to match FastAPI; pytest guards other contracts.
      - run: bash packages/shared/scripts/gen-api-types.sh --check
      # Version checks need both toolchains and a freshly built extension.
      - run: pnpm run build:ext
      - run: bash scripts/check-version.sh

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch both sides of the commit range; separately scan the merged snapshot.
          fetch-depth: 0
          # Nothing after checkout needs repository credentials.
          persist-credentials: false
      # Use a checksum-pinned CLI without granting a scan action PR API or token access.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose \
            --log-opts="$BASE_SHA..$HEAD_SHA" .
      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            LOG_OPTS="--max-count=1 $HEAD_SHA"
          else
            LOG_OPTS="$BASE_SHA..$HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose \
            --log-opts="$LOG_OPTS" .
      - name: Scan tracked snapshot
        run: |
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner --verbose
