[project]
name = "job-tracker-api"
# Source-checkout metadata only. scripts/build-wheel.sh replaces the staged name
# and version from the root VERSION file when it generates the end-user wheel.
version = "0.1.0"
description = "Local FastAPI backend for the personal job tracker"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.140.13",
    "libsql>=0.1.11",
    "pyturso>=0.7.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
job-tracker = "app.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.7.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.mypy]
python_version = "3.14"
files = ["app", "scripts"]
strict = true
# libsql/pyturso ship no type stubs; treat them as untyped rather than failing the build.
[[tool.mypy.overrides]]
module = ["libsql", "turso.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `turso`-marked tests hit a real throwaway Turso DB; keep them out of the default
# offline run. Opt in with `pytest -m turso` (also needs TURSO_TEST_* in the env).
addopts = "-m 'not turso'"
markers = ["turso: integration test against a real Turso DB (needs TURSO_TEST_* env)"]

[tool.ruff]
line-length = 100
# Python target is inferred from project.requires-python (>=3.14).

[tool.ruff.format]
# The codebase is intentionally dense; only wrap on real overflow, don't explode
# every trailing-comma collection one-item-per-line.
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # the formatter owns line length; don't nag on long comments/strings

[tool.ruff.lint.isort]
# Match format.skip-magic-trailing-comma so import grouping stays compact too.
split-on-trailing-comma = false

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]
