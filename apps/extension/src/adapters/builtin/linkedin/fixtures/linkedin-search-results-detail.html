<!-- Layout C detail pane — the right-hand side of /jobs/search-results/, whose
     cards are in linkedin-search-results-card.html. The column is a virtualizing
     LazyColumn; `data-testid` is its only non-hashed hook. Its componentkey is a
     bare uuid that changes per build, so the top card is reached by walking up
     from "More options" to the column boundary — the walk standaloneTopCard()
     already does for layout B.

     Identity has no stable classes here, so it comes from document.title the same
     way layout B's does. The tests set that title themselves; it is not markup. -->

<!-- A stripped search card, present ONLY so the detail anchor stays honest: this
     surface renders cards and the detail pane in one document, and every card
     carries its own "More options". A page-wide query for that label hits this
     one first, so the detail anchor must be scoped to the column. Everything else
     about the card lives in the card fixture, not here. -->
<div role="button" tabindex="0" componentkey="job-card-component-ref-100002">
  <button type="button" aria-label="More options" aria-expanded="false"></button>
</div>

<div data-testid="lazy-column" data-component-type="LazyColumn" componentkey="d0c2b92a-53b3-4d9d-ba95-a4f5ff17a058">
  <div>
    <div data-display-contents="true">
      <button type="button" aria-label="More options" aria-expanded="false"></button>
    </div>
    <div>
      <p>Example Labs</p>
    </div>
    <div>
      <p>Example Senior Backend Engineer</p>
    </div>
    <p>
      <span>Exampleland</span><span> · </span><span>22 hours ago</span><span> · </span><span>76 applicants</span>
    </p>
    <a aria-disabled="false" aria-label="Easy Apply to this job" href="#">Easy Apply</a>
    <a aria-disabled="false" aria-label="Save the job" href="#">Save</a>
  </div>

  <!-- The job description container, empty because that is its steady state on
       this surface — it renders as a skeleton and never fills, so the rescan
       ladder cannot win it. This is what makes layout C look already handled:
       detailElement()'s layout-B selector matches this element, so layout C never
       reaches a missing-element case. It takes the layout-B path and dies at
       renderDetailHead's `if (!text) return`. Capture and the keyword banner both
       depend on a JD, so neither is buildable here until one is reachable. -->
  <div class="_2bedb7c3 _40124eee" componentkey="JobDetails_AboutTheJob_100005">
    <div componentkey="JobDetails_AboutTheJob_100005">
      <div></div>
      <div></div>
    </div>
  </div>
</div>
