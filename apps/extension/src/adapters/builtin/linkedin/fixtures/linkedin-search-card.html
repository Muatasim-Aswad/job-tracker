<!-- Trimmed search card. Its optional <time datetime> is exact day-level posting
     evidence when the open detail and card share a document. The subtitle holds only
     the company; location and workplace sit in the caption. -->

<ul>
  <li data-occludable-job-id="100001">
    <a
      aria-label="Example Backend Engineer at Example Labs"
      href="https://www.linkedin.com/jobs/view/100001/?refId=example&trackingId=example"
    >
      <div class="artdeco-entity-lockup__subtitle">Example Labs</div>
    </a>
    <div class="artdeco-entity-lockup__caption">
      <ul class="job-card-container__metadata-wrapper">
        <li><span> Example City, Exampleland (Hybrid) </span></li>
      </ul>
    </div>
    <ul class="job-card-list__footer-wrapper job-card-container__footer-wrapper">
      <li class="job-card-container__footer-item">
        <time datetime="2026-07-19">1 day ago</time>
      </li>
    </ul>
  </li>
</ul>
