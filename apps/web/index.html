<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-title" content="Job Tracker" />
    <title>Job Tracker</title>
    <!-- Resolve the theme before first paint to avoid a flash: a stored pref
         ('light'/'dark') wins, otherwise follow the system preference. Kept in
         sync with src/lib/theme.ts. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("jt.theme");
          var dark =
            pref === "dark" ||
            ((pref === null || pref === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
